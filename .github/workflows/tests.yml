name: Tests

# Trigger the workflow on push or pull request, but only for the main branch
on:
  pull_request:
  push:
    branches: ["master"]

jobs:
  generate-matrix:
    name: "Generate matrix from cabal"
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    runs-on: ubuntu-latest
    steps:
      - name: Extract the tested GHC versions
        id: set-matrix
        uses: kleidukos/get-tested@v0.1.7.1
        with:
          cabal-file: hsqml.cabal
          ubuntu-version: latest
          version: 0.1.7.1

  tests:
    name: ${{ matrix.ghc }} on ${{ matrix.os }} (Qt${{ matrix.qt }})
    needs: generate-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        ghc: ${{ fromJSON(needs.generate-matrix.outputs.matrix).ghc }}
        os: ${{ fromJSON(needs.generate-matrix.outputs.matrix).os }}
        qt: [5, 6]
    steps:
      - name: Checkout base repo
        uses: actions/checkout@v4

      - name: Set up Haskell
        id: setup-haskell
        uses: haskell-actions/setup@v2.8
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: 3.10.3.0

      - name: Configure
        run: |
          if [ "${{ matrix.qt }}" = "6" ]; then
            cabal configure --enable-tests -f UseQt6
          else
            cabal configure --enable-tests
          fi

      - name: Cache Cabal packages
        uses: actions/cache@v4.2.3
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-ghc-${{ matrix.ghc }}-qt${{ matrix.qt }}-cabal-${{ hashFiles('**/*.cabal', '**/cabal.project', '**/cabal.project.freeze') }}
          restore-keys: |
            ${{ runner.os }}-ghc-${{ matrix.ghc }}-qt${{ matrix.qt }}-cabal-

      - name: Install Qt5 Dependencies
        if: matrix.qt == 5
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qtdeclarative5-dev \
            qml-module-qtquick-controls2 \
            qml-module-qtquick-window2 \
            qml-module-qtquick2 \
            libqt5quick5 \
            qt5-image-formats-plugins \
            qtmultimedia5-dev \
            qml-module-qtmultimedia \
            qttools5-dev-tools \
            qtbase5-dev

      - name: Install Qt6 Dependencies
        if: matrix.qt == 6
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-declarative-dev \
            qt6-base-dev \
            qt6-base-dev-tools \
            libqt6opengl6-dev \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-window

      - name: Build
        run: |
          if [ "${{ matrix.qt }}" = "6" ]; then
            cabal build --enable-tests -f UseQt6
          else
            cabal build --enable-tests
          fi

      - name: Test
        run: |
          export QT_QPA_PLATFORM=offscreen
          if [ "${{ matrix.qt }}" = "6" ]; then
            cabal run hsqml-test1 --enable-tests -f UseQt6
          else
            cabal run hsqml-test1 --enable-tests
          fi
